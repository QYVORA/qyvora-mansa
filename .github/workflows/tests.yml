name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt required on:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet -buildvcs=false ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Test
        run: go test -buildvcs=false ./... -count=1 -timeout 120s

  test-race:
    name: Race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Race tests
        run: go test -buildvcs=false -race ./... -count=1 -timeout 180s

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build linux platforms
        # mansa's transport layer talks to the Linux wireless stack directly
        # (AF_PACKET, HCI, unix.SockFilter), so only linux targets compile —
        # the same Q_OS='linux' declaration the release matrix publishes.
        run: |
          for GOARCH in amd64 arm64; do
            GOOS=linux GOARCH=$GOARCH go build -buildvcs=false \
              -o /tmp/mansa-linux-$GOARCH .
          done
