name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure private module access
        env:
          QYVORA_CI_TOKEN: ${{ secrets.QYVORA_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${QYVORA_CI_TOKEN:-}" ]; then
            echo "::error::QYVORA_CI_TOKEN repository secret is required to fetch private QYVORA modules; see ci-audit/REPORT.md"
            exit 1
          fi
          git config --global "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$QYVORA_CI_TOKEN" | base64 -w0)"
          go env -w GOPRIVATE=github.com/QYVORA/*
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt required on:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet -buildvcs=false ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure private module access
        env:
          QYVORA_CI_TOKEN: ${{ secrets.QYVORA_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${QYVORA_CI_TOKEN:-}" ]; then
            echo "::error::QYVORA_CI_TOKEN repository secret is required to fetch private QYVORA modules; see ci-audit/REPORT.md"
            exit 1
          fi
          git config --global "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$QYVORA_CI_TOKEN" | base64 -w0)"
          go env -w GOPRIVATE=github.com/QYVORA/*
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Test
        run: go test -buildvcs=false ./... -count=1 -timeout 120s

  test-race:
    name: Race tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure private module access
        env:
          QYVORA_CI_TOKEN: ${{ secrets.QYVORA_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${QYVORA_CI_TOKEN:-}" ]; then
            echo "::error::QYVORA_CI_TOKEN repository secret is required to fetch private QYVORA modules; see ci-audit/REPORT.md"
            exit 1
          fi
          git config --global "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$QYVORA_CI_TOKEN" | base64 -w0)"
          go env -w GOPRIVATE=github.com/QYVORA/*
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Race tests
        run: go test -buildvcs=false -race ./... -count=1 -timeout 180s

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure private module access
        env:
          QYVORA_CI_TOKEN: ${{ secrets.QYVORA_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${QYVORA_CI_TOKEN:-}" ]; then
            echo "::error::QYVORA_CI_TOKEN repository secret is required to fetch private QYVORA modules; see ci-audit/REPORT.md"
            exit 1
          fi
          git config --global "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$QYVORA_CI_TOKEN" | base64 -w0)"
          go env -w GOPRIVATE=github.com/QYVORA/*
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build linux platforms
        # mansa's transport layer talks to the Linux wireless stack directly
        # (AF_PACKET, HCI, unix.SockFilter), so only linux targets compile —
        # the same Q_OS='linux' declaration the release matrix publishes.
        run: |
          for GOARCH in amd64 arm64; do
            GOOS=linux GOARCH=$GOARCH go build -buildvcs=false \
              -o /tmp/mansa-linux-$GOARCH .
          done
